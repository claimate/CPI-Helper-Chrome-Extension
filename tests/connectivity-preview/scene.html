<!doctype html>
<!--
  Offline preview of the Connectivity Profile Manager plugin. Mimics the sap.f.DynamicPage based
  "Test Connectivity" page of Integration Suite (2026), builds the global floating toolbar like
  buildFloatingToolbar() in scripts/contentScript.js does and loads the real UI kit, ui.css and the plugin.
  Serve the repo root over http and open /tests/connectivity-preview/scene.html#/shell/monitoring/Connectivity
  ?dark for the dark theme, ?panel to open the plugin panel right away.
-->
<html class="sap-desktop sapUiTheme-sap_horizon">
<head>
<meta charset="utf-8">
<title>Connectivity Profile Manager preview</title>
<script>
  const dark = location.search.includes("dark");
  const theme = dark ? "sap_horizon_dark" : "sap_horizon";
  document.documentElement.className = "sap-desktop sapUiTheme-" + theme;
  for (const lib of ["sap/ui/core", "sap/m", "sap/f"]) {
    document.write(`<link rel="stylesheet" href="https://ui5.sap.com/resources/${lib}/themes/${theme}/library.css">`);
  }
  // local files with a cache buster, edits show up on reload
  const bust = Date.now();
  for (const css of ["icons", "ui", "contentScript", "plugin"]) document.write(`<link rel="stylesheet" href="../../css/${css}.css?v=${bust}">`);
  const script = (src) => document.write(`<script src="../../${src}?v=${bust}"><\/script>`);
</script>
<style>
  :root { --cpi-custom-color: #9cc3ee; --cpi-text-color: #000; --cpi-background-color: #fff; }
  html, body { margin: 0; height: 100%; }
  .shell { height: 48px; background: var(--sapShell_Background); border-bottom: 1px solid var(--sapGroup_ContentBorderColor); display: flex; align-items: center; padding: 0 16px; font: bold 14px var(--sapFontFamily); color: var(--sapShell_TextColor); }
  .page { background: var(--sapBackgroundColor); height: calc(100% - 49px); }
  .sapFDynamicPageTitleWrapper { background: var(--sapObjectHeader_Background); padding: 0.5rem 2rem 0; }
  .crumbs { font: 0.875rem var(--sapFontFamily); color: var(--sapLinkColor); padding-top: 0.5rem; }
  .crumbs span { color: var(--sapTextColor); }
  .sapFDynamicPageTitleMainInner { display: flex; align-items: center; min-height: 2.5rem; }
  .sapFDynamicPageTitleMainHeading { font: bold 1.25rem var(--sapFontHeaderFamily, var(--sapFontFamily)); color: var(--sapTextColor); }
  .tabs { display: flex; gap: 2rem; background: var(--sapObjectHeader_Background); padding: 0.75rem 2rem 0; border-bottom: 1px solid var(--sapGroup_ContentBorderColor); font: bold 0.875rem var(--sapFontFamily); }
  .tabs [role="tab"] { padding-bottom: 0.6rem; color: var(--sapTextColor); cursor: pointer; }
  .tabs [role="tab"][aria-selected="true"] { color: var(--sapSelectedColor); border-bottom: 3px solid var(--sapSelectedColor); }
  .scene-form { margin: 1rem 2rem; padding: 1rem 1.5rem; max-width: 40rem; background: var(--sapGroup_ContentBackground); border-radius: 0.75rem; box-shadow: var(--sapContent_Shadow0); display: grid; grid-template-columns: 12rem 20rem; gap: 0.75rem 1rem; align-items: center; font: 0.875rem var(--sapFontFamily); color: var(--sapTextColor); }
  .scene-form label { text-align: right; color: var(--sapContent_LabelColor); }
  .scene-form input[type="text"] { height: 1.625rem; padding: 0 0.5rem; border: 1px solid var(--sapField_BorderColor); border-radius: 0.25rem; background: var(--sapField_Background); color: var(--sapField_TextColor); font: inherit; }
</style>
<script>
  // stubs for what the content script context normally provides
  var log = { debug() {}, log() {}, warn() {}, error: console.error };
  function extensionAlive() { return true; }
  function statistic() {}
  async function checkURLchange() {}
  var sidebar = { active: false };
  // a Monitoring page: no artifact, so CPI Helper builds the global toolbar
  var cpiData = { tenant: "t", urlExtension: "", currentArtifactType: null, currentArtifactId: null, functions: {} };

  const day = 86400000;
  const profiles = [
    { name: "Production SFTP", type: "SSH", created: new Date(Date.now() - 9 * day).toISOString(), updated: new Date(Date.now() - 2 * day).toISOString(),
      data: { type: "SSH", fields: { host: { id: "__component0---x.Connectivity--inpSSHHost", value: "sftp.example.com", type: "text" }, port: { id: "__component0---x.Connectivity--inpSSHPort", value: "22", type: "text" }, user: { id: "__component0---x.Connectivity--inpSSHUser", value: "cpi_prod", type: "text" } } } },
    { name: "S/4 QA (TLS)", type: "TLS", created: new Date(Date.now() - 30 * day).toISOString(), updated: new Date(Date.now() - day).toISOString(),
      data: { type: "TLS", fields: { host: { id: "__component0---x.Connectivity--inpTLSHost", value: "s4qa.example.com", type: "text" }, port: { id: "__component0---x.Connectivity--inpTLSPort", value: "443", type: "text" }, valid: { id: "__component0---x.Connectivity--chbValidServerCert-CB", value: "on", type: "checkbox" } } } },
    { name: "Partner API <test>", type: "TLS", created: new Date().toISOString(), updated: new Date().toISOString(),
      data: { type: "TLS", fields: { host: { id: "__component0---x.Connectivity--inpTLSHost", value: "api.partner.test", type: "text" }, port: { id: "__component0---x.Connectivity--inpTLSPort", value: "8443", type: "text" } } } },
  ];
  window.localStore = {
    cpiHelper_floatingToolbarPosition: { right: 24, top: 140 },
    cpiHelper_floatingToolbarExpanded: true,
    "connectivityCredentialsManager---profiles": profiles,
  };
  window.syncStore = {};
  const pick = (store, keys) => {
    if (keys == null) return structuredClone(store);
    const out = {};
    for (const k of [].concat(typeof keys === "object" && !Array.isArray(keys) ? Object.keys(keys) : keys)) if (k in store) out[k] = structuredClone(store[k]);
    return out;
  };
  const area = (store) => ({
    get(keys, cb) { const o = pick(store, keys); if (cb) setTimeout(() => cb(o)); return Promise.resolve(o); },
    set(obj, cb) { Object.assign(store, structuredClone(obj)); if (cb) setTimeout(cb); return Promise.resolve(); },
  });
  var chrome = {
    runtime: { lastError: undefined, getURL: (p) => p, getManifest: () => ({}) },
    storage: { onChanged: { addListener() {}, removeListener() {} }, local: area(window.localStore), sync: area(window.syncStore) },
  };
  window.pluginStore = { "connectivityCredentialsManager---isActive": true, "decoy---isActive": true };
  async function callChromeStoragePromise(k) { return k === null ? window.pluginStore : window.pluginStore[k]; }
  // a plugin that did not opt into the global toolbar: must not show up
  var pluginList = [{ id: "decoy", name: "Artifact only plugin", toolbarButton: { title: "Should not be here", onClick() {} } }];
</script>
<script>
  for (const src of ["common/visit-history.js", "common/jump-targets.js", "common/palette-search.js", "scripts/floatingToolbar.js", "scripts/plugins.js",
    "scripts/globalToolbar.js", "scripts/commandPalette.js", "common/ui-kit.js", "common/tools.js", "scripts/ui.js"]) script(src);
</script>
<script>
  // tools.js brings its own storage helpers, the scene keeps the demo stores
  callChromeStoragePromise = async (k) => (k === null ? window.pluginStore : window.pluginStore[k]);
</script>
</head>
<body class="sapUiBody sapUiSizeCompact">
<div class="shell">Integration Suite</div>
<div class="page">
  <article id="__component0---com.sap.it.op.web.ui.pages.connectivity.view.Connectivity--PageConnectivity" class="sapFDynamicPage">
    <header id="__component0---com.sap.it.op.web.ui.pages.connectivity.view.Connectivity--PageConnectivity-header" class="sapContrastPlus sapFDynamicPageTitleWrapper sapFDynamicPageTitleOnly">
      <div class="sapFDynamicPageTitle">
        <div class="sapFDynamicPageTitleTop"><div class="crumbs">Overview / <span>Test Connectivity</span></div></div>
        <div class="sapFDynamicPageTitleMain"><div class="sapFDynamicPageTitleMainInner">
          <div class="sapFDynamicPageTitleMainHeading">Test Connectivity</div>
          <div class="sapFDynamicPageTitleMainContent"></div>
          <div class="sapFDynamicPageTitleMainActions"></div>
        </div></div>
      </div>
    </header>
    <div class="tabs" role="tablist">
      <div role="tab" aria-selected="true">TLS</div><div role="tab" aria-selected="false">SSH</div><div role="tab" aria-selected="false">FTP</div>
      <div role="tab" aria-selected="false">SMTP</div><div role="tab" aria-selected="false">IMAP</div><div role="tab" aria-selected="false">POP3</div>
      <div role="tab" aria-selected="false">AMQP</div><div role="tab" aria-selected="false">Kafka</div><div role="tab" aria-selected="false">Cloud Connector</div>
    </div>
    <div class="scene-form">
      <label for="__component0---x.Connectivity--inpTLSHost">Host:</label><input type="text" id="__component0---x.Connectivity--inpTLSHost" value="s4qa.example.com">
      <label for="__component0---x.Connectivity--inpTLSPort">Port:</label><input type="text" id="__component0---x.Connectivity--inpTLSPort" value="443">
      <label for="__component0---x.Connectivity--inpTLSUser">User:</label><input type="text" id="__component0---x.Connectivity--inpTLSUser" value="">
    </div>
  </article>
</div>
<div class="ch_light" id="cpihelperglobal"><div class="cpiHelper ui modal" id="cpiHelper_semanticui_modal"></div><div class="cpiHelper ui modal" id="cpiHelper_waiting_model"></div></div>
<script>if (dark) document.getElementById("cpihelperglobal").className = "ch_dark";</script>
<script>script("plugins/connectivityCredentialsManager.js")</script>
<script>
  // the global branch of buildFloatingToolbar() in scripts/contentScript.js
  window.build = async () => {
    const globalPlugins = await getGlobalToolbarPlugins();
    const toolbar = await createFloatingToolbar(["global", ...globalPlugins.map((entry) => entry.plugin.id)].join(":"));
    addGlobalNavigationButtons(toolbar);
    if (globalPlugins.length) {
      addFloatingToolbarSeparator(toolbar, "Plugins");
      addPluginToolbarEntries(toolbar, globalPlugins);
    }
    addFloatingToolbarButton(toolbar, { id: "__more_plugins", icon: "plugins", title: "Plugins", onClick() {} });
    return toolbar;
  };
  window.addEventListener("load", async () => {
    await build();
    if (location.search.includes("panel")) document.getElementById("cpiHelperToolbarPlugin--connectivityCredentialsManager")?.click();
  });
</script>
</body>
</html>
